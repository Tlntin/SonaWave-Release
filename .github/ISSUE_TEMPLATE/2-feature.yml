name: 功能建议 / Feature request
description: 想要新功能或改进 / Suggest a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜一下已有的 Issue，也可以看看 README 里的「各版本功能对比」，鸿蒙版有、安卓 / Windows 版还没做的功能都在里面。
        Please search existing issues first, and check the feature comparison in the README.

  - type: checkboxes
    id: platforms
    attributes:
      label: 希望在哪些平台上有 / Platform
      description: 可多选 / Select all that apply
      options:
        - label: 安卓手机、平板 / Android phone, tablet
        - label: 安卓电视、盒子、车机 / Android TV, TV box, car
        - label: Windows
        - label: macOS
        - label: Linux
        - label: 鸿蒙 / HarmonyOS
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本号 / macOS version
      description: 选择 macOS 时请填写系统版本号；其他平台可留空 / For macOS, enter the OS version; leave blank for other platforms
      placeholder: 例如 macOS 15.6 / e.g. macOS 15.6
    validations:
      required: false

  - type: dropdown
    id: macos-architecture
    attributes:
      label: Mac 架构 / Mac architecture
      description: 选择 macOS 时请选择 Mac 的处理器架构 / For macOS, select your Mac's processor architecture
      options:
        - 不适用 / Not macOS
        - arm64（Apple 芯片 / Apple silicon）
        - x86_64（Intel / x86）
        - 不确定 / Not sure
      default: 0
    validations:
      required: false

  - type: input
    id: linux-distro
    attributes:
      label: Linux 发行版名称与版本号 / Linux distribution and version
      description: 选择 Linux 时请填写具体的发行版名称和版本号；其他平台可留空 / For Linux, enter the distribution name and version; leave blank for other platforms
      placeholder: 例如 Ubuntu 24.04、deepin 25、Debian 13 / e.g. Ubuntu 24.04, deepin 25, Debian 13
    validations:
      required: false

  - type: dropdown
    id: linux-architecture
    attributes:
      label: Linux 架构 / Linux architecture
      description: 选择 Linux 时请选择系统架构 / For Linux, select your system architecture
      options:
        - 不适用 / Not Linux
        - arm64（aarch64）
        - x86_64（AMD64 / x86）
        - 不确定 / Not sure
      default: 0
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: 想要什么功能 / What would you like
      placeholder: 尽量具体，可以附上其他 App 的截图作参考 / Be specific; screenshots from other apps are welcome
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 用在什么场景 / Why do you need it
      placeholder: 现在是怎么做的、哪里不方便 / How you do it today and what's inconvenient
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我搜过已有的 Issue，没有重复 / I searched existing issues
          required: true
